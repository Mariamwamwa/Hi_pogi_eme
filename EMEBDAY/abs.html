```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABS 💪</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      width:100vw;
      height:100vh;
      overflow:hidden;
      background:
        radial-gradient(
          ellipse at bottom,
          #ff1a1a 0%,
          #b30000 18%,
          #4a0000 38%,
          #140000 58%,
          #000000 82%
        );
      position:relative;
      font-family:Arial, sans-serif;
    }

    .abs-picture{
      position:absolute;
      width:180px;
      height:180px;
      border-radius:25px;
      overflow:hidden;
      box-shadow:0 10px 30px rgba(0,0,0,0.35);
      border:3px solid rgba(255,255,255,0.6);

      animation:
        float 5s ease-in-out infinite,
        zoom 3s ease-in-out infinite;
    }

    .abs-picture img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    @keyframes zoom{
      0%, 100%{
        transform:scale(0.85);
      }

      50%{
        transform:scale(1.15);
      }
    }

    @keyframes float{
      0%, 100%{
        margin-top:0;
      }

      50%{
        margin-top:-25px;
      }
    }

    .pic1{
      top:5%;
      left:5%;
      animation-delay:0s;
    }

    .pic2{
      top:10%;
      right:7%;
      animation-delay:0.7s;
    }

    .pic3{
      top:40%;
      left:18%;
      animation-delay:1.2s;
    }

    .pic4{
      top:35%;
      right:18%;
      animation-delay:1.8s;
    }

    .pic5{
      bottom:5%;
      left:5%;
      animation-delay:2.3s;
    }

    .pic6{
      bottom:7%;
      right:7%;
      animation-delay:2.8s;
    }

    .pic7{
      top:20%;
      left:42%;
      animation-delay:1.5s;
    }

    .pic8{
      bottom:20%;
      left:40%;
      animation-delay:0.5s;
    }

    /* Center title */
    .title{
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%, -50%);
      z-index:20;

      color:white;
      font-size:3rem;
      text-align:center;

      text-shadow:
        0 0 10px rgba(255,255,255,0.7),
        0 5px 20px rgba(0,0,0,0.3);

      pointer-events:none;
    }

    /* MORE BUTTON */
    .more-button{
      position:fixed;
      bottom:25px;
      left:50%;
      transform:translateX(-50%);

      padding:15px 30px;
      border:none;
      border-radius:30px;

      background:rgba(255,255,255,0.2);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);

      border:2px solid rgba(255,255,255,0.5);

      color:white;
      font-size:1.1rem;
      font-weight:bold;

      cursor:pointer;
      z-index:100;

      box-shadow:0 8px 25px rgba(0,0,0,0.25);

      transition:0.25s ease;
    }

    .more-button:hover{
      transform:translateX(-50%) scale(1.08);
      background:rgba(255,255,255,0.35);
    }

    .more-button:active{
      transform:translateX(-50%) scale(0.95);
    }

    @media(max-width:700px){

      .abs-picture{
        width:120px;
        height:120px;
      }

      .title{
        font-size:2rem;
      }

      .more-button{
        font-size:0.95rem;
        padding:12px 24px;
      }

    }

  </style>
</head>

<body>

  <div class="title">
    Bigla kong binanas hahaah
  </div>

  <div class="abs-picture pic1">
    <img src="abs/1.jpg">
  </div>

  <div class="abs-picture pic2">
    <img src="abs/2.jpg">
  </div>

  <div class="abs-picture pic3">
    <img src="abs/3.jpg">
  </div>

  <div class="abs-picture pic4">
    <img src="abs/4.jpg">
  </div>

  <div class="abs-picture pic5">
    <img src="abs/5.jpg">
  </div>

  <div class="abs-picture pic6">
    <img src="abs/6.jpg">
  </div>

  <div class="abs-picture pic7">
    <img src="abs/7.jpg">
  </div>

  <div class="abs-picture pic8">
    <img src="abs/8.jpg">
  </div>

  <!-- MORE BUTTON -->
  <button class="more-button" onclick="moreClicked()">
    Click Here For Moreee 🔥
  </button>

  <script>

    function moreClicked(){
        window.location.href = "greeting.html";
    }

  </script>

</body>
</html>
